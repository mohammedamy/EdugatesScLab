<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edugates-ClipSAT Science Labs - Redirecting...</title>
  <meta name="robots" content="noindex, follow">
  <script>
    (function() {
      try {
        var currentHref = window.location.href || "";
        var currentPath = window.location.pathname || "";
        var currentSearch = window.location.search || "";
        var currentHash = window.location.hash || "";
        var targetBase = "https://mohammedamy.github.io/EdugatesScLab/";

        // 1. Detect old typo URL (EdugtesScLab -> EdugatesScLab)
        if (/EdugtesScLab/i.test(currentHref) || /EdugtesScLab/i.test(currentPath)) {
          var cleanHash = currentHash;
          window.location.replace(targetBase + currentSearch + cleanHash);
          return;
        }

        // 2. Detect SPA deep routes or unknown paths under EdugatesScLab
        if (currentPath.indexOf("/EdugatesScLab/") === 0) {
          var subPath = currentPath.substring("/EdugatesScLab/".length).replace(/^\/+/, "");
          if (subPath && subPath !== "index.html" && subPath !== "404.html") {
            window.location.replace(targetBase + "#" + subPath + currentSearch);
            return;
          }
        }

        // 3. Fallback safe redirection
        window.location.replace(targetBase + currentHash);
      } catch (err) {
        window.location.href = "https://mohammedamy.github.io/EdugatesScLab/";
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://mohammedamy.github.io/EdugatesScLab/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #070a12;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .redirect-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; margin: 0 0 10px; color: #38bdf8; }
    p { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; margin: 0 0 20px; }
    a { color: #38bdf8; text-decoration: underline; font-weight: 600; }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Redirecting to Edugates-ClipSAT Science Labs</h1>
    <p>Please wait while we transfer you to the official platform...</p>
    <p><a href="https://mohammedamy.github.io/EdugatesScLab/">Click here if you are not redirected automatically</a></p>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-bio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="dna-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid-bio" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(52, 211, 153, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="400" height="200" fill="url(#bg-grad-bio)"/>
  <rect width="400" height="200" fill="url(#grid-bio)"/>
  
  <circle cx="200" cy="90" r="70" fill="#10b981" opacity="0.12" filter="blur(20px)"/>
  
  <!-- Stylized DNA Double Helix -->
  <g transform="translate(145, 42)">
    <path d="M 10 20 Q 35 50, 60 20 T 110 20" fill="none" stroke="url(#dna-glow)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 10 70 Q 35 40, 60 70 T 110 70" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Base pair rungs -->
    <line x1="22" y1="33" x2="22" y2="57" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="45" x2="35" y2="45" stroke="rgba(255,255,255,0.8)" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="33" x2="48" y2="57" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="33" x2="72" y2="57" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="45" x2="85" y2="45" stroke="rgba(255,255,255,0.8)" stroke-width="3" stroke-linecap="round"/>
    <line x1="98" y1="33" x2="98" y2="57" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
    <!-- Node balls -->
    <circle cx="22" cy="33" r="3.5" fill="#34d399"/>
    <circle cx="22" cy="57" r="3.5" fill="#22d3ee"/>
    <circle cx="48" cy="33" r="3.5" fill="#34d399"/>
    <circle cx="48" cy="57" r="3.5" fill="#22d3ee"/>
    <circle cx="72" cy="33" r="3.5" fill="#34d399"/>
    <circle cx="72" cy="57" r="3.5" fill="#22d3ee"/>
    <circle cx="98" cy="33" r="3.5" fill="#34d399"/>
    <circle cx="98" cy="57" r="3.5" fill="#22d3ee"/>
  </g>
  
  <text x="200" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1.5">BIOLOGY &amp; LIFE SCIENCES</text>
  <text x="200" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255, 255, 255, 0.6)" letter-spacing="0.5">Cellular, Molecular &amp; Genetic Biology</text>
</svg>

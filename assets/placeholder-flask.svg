<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-chem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="flask-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <pattern id="grid-chem" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg-grad-chem)"/>
  <rect width="400" height="200" fill="url(#grid-chem)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="90" r="70" fill="#38bdf8" opacity="0.12" filter="blur(20px)"/>
  
  <!-- Scientific Conical Erlenmeyer Flask Graphic -->
  <g transform="translate(160, 40)">
    <!-- Flask Outline -->
    <path d="M 32 10 L 48 10 L 48 30 L 72 82 C 75 88, 70 94, 62 94 L 18 94 C 10 94, 5 88, 8 82 L 32 30 Z" 
          fill="rgba(15, 23, 42, 0.7)" stroke="url(#flask-glow)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Liquid Level -->
    <path d="M 21 68 Q 40 64, 59 68 L 68 87 C 70 91, 67 93, 62 93 L 18 93 C 13 93, 10 91, 12 87 Z" 
          fill="url(#flask-glow)" opacity="0.45"/>
    <!-- Measurement graduation lines -->
    <line x1="38" y1="56" x2="48" y2="56" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="34" y1="68" x2="48" y2="68" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="80" x2="48" y2="80" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Floating Reactant Bubbles -->
    <circle cx="36" cy="80" r="3" fill="#ffffff" opacity="0.75"/>
    <circle cx="48" cy="74" r="2" fill="#ffffff" opacity="0.85"/>
    <circle cx="42" cy="62" r="2.5" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- Label Banner -->
  <text x="200" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CHEMISTRY LABORATORY</text>
  <text x="200" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255, 255, 255, 0.6)" letter-spacing="0.5">McGraw-Hill Inspire Chemistry</text>
</svg>
